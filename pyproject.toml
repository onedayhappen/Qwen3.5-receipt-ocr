[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen35-receipt-ocr"
version = "0.1.0"
description = "Independent Qwen3.5 receipt extraction, data governance, SFT, DPO and RLVR toolkit"
readme = "docs/plan.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = ["Pillow>=11,<13", "jsonschema>=4.23,<5", "requests>=2.32,<3"]

[project.optional-dependencies]
data = ["pyarrow>=18,<26", "numpy>=2,<3"]
serve = ["Flask>=3.1,<4"]
dev = ["pytest>=8,<10"]
train = ["torch==2.8.0", "torchvision==0.23.0", "transformers==5.3.0", "trl==0.25.0", "peft==0.15.2", "accelerate==1.10.1", "datasets==3.5.1", "qwen-vl-utils==0.0.14", "ujson>=5.10,<6", "safetensors>=0.6,<1", "tensorboard>=2.19,<3", "scikit-learn>=1.7,<2", "einops>=0.8,<1"]
kernels = ["deepspeed==0.17.5", "liger-kernel==0.8.0", "bitsandbytes==0.49.2"]
inference = ["vllm>=0.17,<0.29"]

[project.scripts]
receipt-train = "receipt.train_launcher:main"
receipt-batch-infer = "receipt.inference:main"
receipt-evaluate = "receipt.evaluate:main"
receipt-serve = "receipt.service:main"
receipt-download = "receipt.download:main"
receipt-data = "receipt.data:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = ["params", "constants", "utils", "merge_lora_weights"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["receipt*", "dataset*", "model*", "train*", "trainer*", "loss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
